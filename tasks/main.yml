---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add configured users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_host_users }}"

- name: Install iptables-persistent (persists DOCKER-USER rules across reboot)
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  when: docker_published_ports | length > 0

- name: Allow configured Docker-published ports from their allowed source (DOCKER-USER)
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    source: "{{ item.from }}"
    jump: RETURN
    action: insert
  loop: "{{ docker_published_ports }}"
  notify: Save iptables rules

- name: Drop Docker-published ports from any other source (DOCKER-USER)
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    jump: DROP
    action: append
  loop: "{{ docker_published_ports }}"
  notify: Save iptables rules
