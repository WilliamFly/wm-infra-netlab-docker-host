---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add configured users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_host_users }}"

- name: Install iptables-persistent (persists DOCKER-USER rules across reboot)
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  when: docker_published_ports | length > 0

- name: Flush DOCKER-USER chain (rebuilt fresh each run)
  ansible.builtin.command: iptables -F DOCKER-USER
  when: docker_published_ports | length > 0
  changed_when: true
  notify: Save iptables rules

- name: Insert DOCKER-USER allow rule for configured source (per published port)
  ansible.builtin.command: >
    iptables -I DOCKER-USER 1 -p {{ item.proto }}
    -m conntrack --ctorigdstport {{ item.port }}
    -s {{ item.from }} -j RETURN
  loop: "{{ docker_published_ports }}"
  changed_when: true
  notify: Save iptables rules

- name: Append DOCKER-USER drop rule for any other source (per published port)
  ansible.builtin.command: >
    iptables -A DOCKER-USER -p {{ item.proto }}
    -m conntrack --ctorigdstport {{ item.port }} -j DROP
  loop: "{{ docker_published_ports }}"
  changed_when: true
  notify: Save iptables rules
