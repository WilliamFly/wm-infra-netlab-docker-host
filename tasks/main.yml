---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add configured users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_host_users }}"

- name: Render DOCKER-USER firewall script
  ansible.builtin.template:
    src: docker-user-firewall.sh.j2
    dest: /usr/local/bin/docker-user-firewall.sh
    owner: root
    group: root
    mode: "0755"
  when: docker_published_ports | length > 0
  notify: Restart docker-user-firewall

- name: Install docker-user-firewall systemd unit
  ansible.builtin.template:
    src: docker-user-firewall.service.j2
    dest: /etc/systemd/system/docker-user-firewall.service
    owner: root
    group: root
    mode: "0644"
  when: docker_published_ports | length > 0
  notify: Restart docker-user-firewall

- name: Ensure docker-user-firewall service is enabled and started
  ansible.builtin.systemd:
    name: docker-user-firewall
    enabled: true
    state: started
    daemon_reload: true
  when: docker_published_ports | length > 0
